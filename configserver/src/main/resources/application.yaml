spring:
  application:
    name: "configserver"
  profiles:
    # active: native
    active: "git"
  cloud:
    config:
      server:
        # native:
        # search-locations: "classpath:/config"
        # search-locations: "file:///Users//rahul//Documents//config"
        git:
          uri: "https://github.com/rahulkumarverma1311/micro-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
#        native:
#          search-locations: "file:///D:/learn/microservice%20%20v2%20cloud/config"
#          search-locations: "classpath:/config"
#  rabbitmq:
#    host: "localhost"
#    port: "5672"
#    username: "guest"
#    password: "guest"
encrypt:
  key: "5A7F9E2D84C1B3F6E8A1D47C92B5F0E16C3A9D7B4F81E25C6A0B3E9F7D2C145"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "uat"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      endpoint:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8071